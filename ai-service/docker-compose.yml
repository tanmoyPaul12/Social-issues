services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      INDICTRANS_MODEL_PATH: /app/models/indictrans2/indic-en
      TRANSLATION_DEVICE: cpu
      MODEL_CACHE_DIR: /app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

