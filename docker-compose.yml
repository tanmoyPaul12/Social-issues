name: social-issues-platform

services:
  # ──────────────────────────────────────────────
  # REDIS 7 (Session Store, OTP Cache, Celery Broker)
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: social-issues-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MINIO (S3-Compatible Local Object Storage)
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: social-issues-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MINIO BUCKET INITIALIZER (Auto-creates S3 buckets)
  # ──────────────────────────────────────────────
  create-buckets:
    image: minio/mc:latest
    container_name: social-issues-minio-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/evidence-uploads;
      /usr/bin/mc mb --ignore-existing local/certificates;
      /usr/bin/mc mb --ignore-existing local/legal-agreements;
      /usr/bin/mc anonymous set download local/evidence-uploads;
      exit 0;
      "

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
