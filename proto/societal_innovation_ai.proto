syntax = "proto3";

package com.example.social_issues.ai.grpc;

option java_multiple_files = true;
option java_package = "com.example.social_issues.ai.grpc";
option java_outer_classname = "SocietalAiProto";

// ==========================================
// 1. AI University Matcher & Triage Service
// ==========================================
service AiMatcherService {
    // Matches and ranks top 3 HEI capstone research labs for a citizen problem
    rpc RouteChallenge (ChallengeRouteRequest) returns (ChallengeRouteResponse);

    // Executes 4-modality weighted generalization and priority consensus
    rpc ProcessMultimodalIntelligence (MultimodalIntelligenceRequest) returns (MultimodalIntelligenceResponse);
}

// ==========================================
// 2. Routing Messages
// ==========================================
message ChallengeRouteRequest {
    string challenge_id = 1;
    string title = 2;
    string description = 3;
    string district = 4;
    string block = 5;
    string sector_hint = 6;
}

message HEIMatchDto {
    string hei_id = 1;
    string hei_name = 2;
    double match_score = 3;
    string rationale = 4;
}

message ChallengeRouteResponse {
    string challenge_id = 1;
    repeated HEIMatchDto recommended_heis = 2;
}

// ==========================================
// 3. Multimodal Intelligence Messages
// ==========================================
message MultimodalIntelligenceRequest {
    string issue_id = 1;
    string title = 2;
    string description = 3;
    string combined_english_text = 4;
    double latitude = 5;
    double longitude = 6;
    string district = 7;
    string block = 8;
    string image_url = 9;
    string pdf_url = 10;
}

message MultimodalIntelligenceResponse {
    string issue_id = 1;
    string final_category = 2;
    string final_priority_level = 3; // "CRITICAL", "HIGH", "MEDIUM", "LOW"
    double average_priority_score = 4;
    string consensus_reason = 5;
    string validation_status = 6;
}
